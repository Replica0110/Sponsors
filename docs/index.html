<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赞助者列表</title>
  <meta name="description" content="感谢所有支持 Lyrico 的赞助者">
  <style>
    :root {
      --bg: #eef7ff;
      --bg-2: #f7fbff;
      --card: rgba(255, 255, 255, 0.74);
      --text: #102033;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-2: #38bdf8;
      --border: rgba(37, 99, 235, 0.18);
      --shadow: 0 20px 60px rgba(15, 76, 129, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.24), transparent 28rem),
        radial-gradient(circle at 82% 8%, rgba(37, 99, 235, 0.20), transparent 30rem),
        linear-gradient(135deg, var(--bg), var(--bg-2));
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 48px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 56px;
      border: 1px solid var(--border);
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.84), rgba(255,255,255,0.52));
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -100px;
      top: -100px;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      opacity: 0.18;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      color: #1d4ed8;
      background: rgba(37, 99, 235, 0.12);
      font-weight: 700;
      font-size: 14px;
    }

    h1 {
      max-width: 760px;
      margin: 22px 0 16px;
      font-size: clamp(42px, 7vw, 78px);
      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    .hero-text {
      max-width: 640px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 32px;
      max-width: 520px;
    }

    .stat {
      padding: 20px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.62);
    }

    .stat strong {
      display: block;
      font-size: 30px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: 42px 0 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.03em;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .sponsor-card {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 104px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 12px 34px rgba(15, 76, 129, 0.08);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .sponsor-card:hover {
      transform: translateY(-4px);
      border-color: rgba(37, 99, 235, 0.34);
      box-shadow: 0 20px 48px rgba(15, 76, 129, 0.14);
    }

    .avatar {
      width: 58px;
      height: 58px;
      flex: 0 0 58px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.18), rgba(56, 189, 248, 0.22));
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 22px;
    }

    .sponsor-info h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }

    .sponsor-info p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 40px;
      border-radius: 28px;
      border: 1px dashed var(--border);
      text-align: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.45);
      grid-column: 1 / -1;
    }

    .footer {
      margin-top: 48px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    .footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      opacity: 0.9;
    }

    .footer a:hover {
      opacity: 1;
    }

    .footer code {
      font-family: inherit;
      opacity: 0.9;
    }
    @media (max-width: 720px) {
      .page {
        width: min(100% - 20px, 1120px);
        padding-top: 24px;
      }

      .hero {
        padding: 32px 24px;
        border-radius: 28px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .section-title {
        display: block;
      }

      .section-title p {
        margin-top: 8px;
      }
      .footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
        opacity: 0.9;
      }

      .footer a:hover {
        opacity: 1;
      }

      .footer code {
        font-family: inherit;
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="badge">❤️ Sponsors</div>
      <h1>感谢每一位支持者</h1>
      <p class="hero-text">
        你们的支持让 Lyrico 能够持续改进。这里记录所有通过爱发电支持项目的朋友
      </p>

      <div class="stats">
        <div class="stat">
          <strong>1</strong>
          <span>累计赞助者</span>
        </div>
        <div class="stat">
          <strong>UTC+8</strong>
          <span>更新时间：2026-07-07 23:17:34</span>
        </div>
      </div>
    </section>

    <section>
      <div class="section-title">
        <h2>赞助者列表</h2>
        <p>按最近赞助时间排序</p>
      </div>

      <div class="grid">
        
        <article class="sponsor-card">
          <div class="avatar">
            <img src="https://pic1.afdiancdn.com/default/avatar/avatar-purple.png?imageView2/1/" alt="爱发电用户_8593b" loading="lazy" referrerpolicy="no-referrer">
          </div>
          <div class="sponsor-info">
            <h3>爱发电用户_8593b</h3>
            <p>2026-06-09 18:07:41</p>
          </div>
        </article>
        
      </div>
    </section>

    <footer class="footer">
      <a href="https://github.com/Replica0110/Lyrico" target="_blank" rel="noopener noreferrer">
      Github
      </a>
      ·
      <a href="https://ifdian.net/a/replica0110" target="_blank" rel="noopener noreferrer">
      爱发电
      </a>
</footer>
  </main>
</body>
</html>
